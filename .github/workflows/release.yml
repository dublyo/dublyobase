name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * *" # nightly (base-image freshness for :main)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never publish an untested image: the same gates as ci.yml must pass first.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dublyobase
          POSTGRES_PASSWORD: dublyobase
          POSTGRES_DB: dublyobase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dublyobase"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://dublyobase:dublyobase@localhost:5432/dublyobase_test?sslmode=disable

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dublyo/dublyobase
          # semver adds :latest automatically on tag pushes (flavor latest=auto)
          tags: |
            type=semver,pattern=v{{version}}
            type=ref,event=branch
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
