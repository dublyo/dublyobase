name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dublyobase
          POSTGRES_PASSWORD: dublyobase
          POSTGRES_DB: dublyobase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dublyobase"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://dublyobase:dublyobase@localhost:5432/dublyobase_test?sslmode=disable
